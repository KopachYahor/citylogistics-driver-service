spring:
  application:
    name: driver-service
  config:
    # Локальные секреты из .env (образец: .env.example). Переменные окружения важнее
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5433/drivers
    username: drivers
    password: drivers
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # По умолчанию send() ждёт брокер 60 с, держа транзакцию слушателя
        max.block.ms: 5000
    consumer:
      group-id: driver-service-group
      # Первый запуск группы: читать с начала, чтобы не пропустить ранние заказы
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Битое сообщение логируется и пропускается, а не блокирует консьюмер
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.kopach.logistics.*"

server:
  port: 8082

# Общий ключ с core, в git не хранится
internal:
  api-key: ${INTERNAL_API_KEY}

logging:
  level:
    com.kopach.logistics: DEBUG
    org.springframework.kafka: INFO